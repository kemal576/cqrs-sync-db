apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
  namespace: cache
spec:
  ports:
  - port: 6379
    name: redis
  clusterIP: None
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: cache
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ "${HOSTNAME}" = "redis-0" ]; then
              # Master
              redis-server --port 6379 --appendonly yes
            else
              # Replica
              redis-server --port 6379 --appendonly yes --replicaof redis-0.redis 6379
            fi
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 512Mi