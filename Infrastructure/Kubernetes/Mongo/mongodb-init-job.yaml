apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-replicaset
  namespace: mongo
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mongo-init
        image: mongo:6.0
        command:
        - bash
        - -c
        - |
          echo "Waiting for MongoDB to be ready..."
          for i in {1..60}; do
            if mongosh --host mongodb-0.mongodb --eval "db.adminCommand('ping')" &>/dev/null; then
              echo "MongoDB is ready!"
              break
            fi
            echo "Attempt $i/60: MongoDB not ready yet, waiting..."
            sleep 2
          done
          
          echo "Checking replica set status..."
          if mongosh --host mongodb-0.mongodb --eval "rs.status()" &>/dev/null; then
            echo "Replica set already initialized!"
            exit 0
          fi
          
          echo "Initializing replica set..."
          mongosh --host mongodb-0.mongodb --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb-0.mongodb.mongo.svc.cluster.local:27017'}]})"
          
          echo "Replica set initialized successfully!"
