apiVersion: v1
kind: Service
metadata:
  name: krakend-gateway
  labels:
    app: krakend-gateway
  namespace: gateway
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30084
      protocol: TCP
  selector:
    app: krakend-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krakend-gateway
  labels:
    app: krakend-gateway
  namespace: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krakend-gateway
  template:
    metadata:
      labels:
        app: krakend-gateway
    spec:
      containers:
      - name: krakend
        image: krakend-gateway:test
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        command: ["/usr/bin/krakend"]
        args: ["run", "-d", "-c", "/etc/krakend/krakend.json", "-p", "8080"]
        env:
        - name: KRAKEND_PORT
          value: "8080"
        volumeMounts:
        - name: krakend-config
          mountPath: /etc/krakend
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /__health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /__health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: krakend-config
        configMap:
          name: krakend-config
