apiVersion: v1
kind: Service
metadata:
  name: productread
  labels:
    app: product-read
  namespace: product-read
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
      name: http
  selector:
    app: product-read
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productread
  labels:
    app: product-read
  namespace: product-read
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-read
  template:
    metadata:
      labels:
        app: product-read
    spec:
      containers:
      - name: productread
        image: productread:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ELASTICSEARCH_ADDR
          value: http://elasticsearch.elastic.svc.cluster.local:9200
        - name: REDIS_MASTER_NAME
          value: mymaster
        - name: REDIS_SENTINELS
          value: redis-sentinel-0.redis-sentinel.cache.svc.cluster.local:26379,redis-sentinel-1.redis-sentinel.cache.svc.cluster.local:26379,redis-sentinel-2.redis-sentinel.cache.svc.cluster.local:26379
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
