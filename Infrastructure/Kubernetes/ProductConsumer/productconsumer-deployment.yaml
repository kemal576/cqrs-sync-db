apiVersion: v1
kind: Service
metadata:
  name: productconsumer
  labels:
    app: product-consumer
  namespace: cdc
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: product-consumer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productconsumer
  labels:
    app: product-consumer
  namespace: cdc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-consumer
  template:
    metadata:
      labels:
        app: product-consumer
    spec:
      containers:
      - name: productconsumer
        image: productconsumer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KAFKA_BROKER
          value: kafka-cdc:9092
        - name: PRODUCT_CDC_TOPIC
          value: product.ProductDb.Products
        - name: ELASTICSEARCH_ADDR
          value: http://elasticsearch.elastic.svc.cluster.local:9200
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
