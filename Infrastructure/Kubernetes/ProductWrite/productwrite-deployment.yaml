apiVersion: v1
kind: Service
metadata:
  name: productwrite
  labels:
    app: product-write
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http
  selector:
    app: product-write
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productwrite
  labels:
    app: product-write
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-write
  template:
    metadata:
      labels:
        app: product-write
    spec:
      containers:
      - name: productwrite
        image: productwrite:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: MongoSettings__ConnectionString
          value: mongodb://mongodb-0.mongodb.mongo.svc.cluster.local:27017/?directConnection=true
        - name: MongoSettings__DatabaseName
          value: ProductDb
        - name: REDIS_NODES
          value: redis-lock-0.redis-lock.lock.svc.cluster.local:6379,redis-lock-1.redis-lock.lock.svc.cluster.local:6379,redis-lock-2.redis-lock.lock.svc.cluster.local:6379
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
